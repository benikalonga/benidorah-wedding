services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    volumes:
      - uploads:/data/uploads
      - private_media:/data/private-media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    # On a dedicated VPS, the `nginx` service below reaches this container
    # over the compose-internal network and this port mapping isn't needed.
    # On a *shared* box where an existing host-level nginx already owns
    # ports 80/443 for multiple sites (our case on 162.35.172.181), that
    # host nginx needs a host-reachable port to proxy_pass to instead —
    # bound to loopback only, since it's reached locally, not from the
    # internet directly.
    ports:
      - "127.0.0.1:3001:3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # `nginx` and `certbot` below are for a *dedicated* VPS where this app
  # owns ports 80/443 outright (see deploy.md). On a shared host that
  # already runs its own nginx for multiple sites (see
  # deploy-replace-existing.md), skip both — `docker compose up -d db web`
  # only — and add a server block to the existing host nginx config
  # instead, proxying to 127.0.0.1:3001 (the `web` port mapping above).
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/benidorah.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/data/uploads:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"

volumes:
  pg_data:
  uploads:
  private_media:
  certbot_certs:
  certbot_www:
